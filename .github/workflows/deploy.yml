name: CI/CD Backend - Innovatech Chile

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    name: Construir imagen y desplegar en EC2
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Construir y publicar imagen Docker en ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: innovatech-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/labsuser.pem
          chmod 600 ~/.ssh/labsuser.pem

      - name: Desplegar en EC2 Backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: innovatech-backend
          IMAGE_TAG: latest
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/labsuser.pem \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/innovatech-backend:latest
            docker stop innovatech-backend || true
            docker rm innovatech-backend || true
            docker run -d \
              --name innovatech-backend \
              --restart unless-stopped \
              -p 8081:8081 \
              -e DB_ENDPOINT=db \
              -e DB_PORT=3306 \
              -e DB_NAME=despachos_db \
              -e DB_USERNAME=despacho_user \
              -e DB_PASSWORD=DespachoPass2025! \
              ${{ steps.login-ecr.outputs.registry }}/innovatech-backend:latest
          ENDSSH