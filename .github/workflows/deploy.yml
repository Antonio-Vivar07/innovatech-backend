name: CI/CD Backend - Innovatech Chile

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    name: Construir imagen y desplegar en EC2
    runs-on: self-hosted

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Construir y publicar imagen en Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-backend:${{ github.sha }}

      - name: Desplegar en EC2 Backend
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i /home/ec2-user/.ssh/labsuser.pem \
              ec2-user@10.0.2.136 << 'ENDSSH'
            docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} \
              -p ${{ secrets.DOCKER_HUB_TOKEN }}
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-backend:latest
            docker stop innovatech-backend || true
            docker rm innovatech-backend || true
            docker run -d \
              --name innovatech-backend \
              --restart unless-stopped \
              -p 8081:8081 \
              -e DB_ENDPOINT=db \
              -e DB_PORT=3306 \
              -e DB_NAME=despachos_db \
              -e DB_USERNAME=despacho_user \
              -e DB_PASSWORD=DespachoPass2025! \
              ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-backend:latest
          ENDSSH