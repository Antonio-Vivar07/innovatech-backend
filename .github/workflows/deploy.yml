name: CI/CD Backend - Innovatech Chile

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    name: Construir imagen y desplegar en EC2
    runs-on: self-hosted

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Construir y publicar imagen en Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-backend:${{ github.sha }}

      - name: Desplegar en EC2 Backend
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_KEY" > /tmp/deploy_key.pem
          chmod 600 /tmp/deploy_key.pem
          sed "s|DOCKER_USER_PLACEHOLDER|$DOCKER_USER|g" docker-compose.deploy.yml > /tmp/docker-compose-deploy.yml
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key.pem $EC2_USER@$EC2_HOST "mkdir -p ~/innovatech-backend"
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key.pem /tmp/docker-compose-deploy.yml $EC2_USER@$EC2_HOST:~/innovatech-backend/docker-compose.yml
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key.pem $EC2_USER@$EC2_HOST "cd ~/innovatech-backend && docker login -u $DOCKER_USER -p $DOCKER_TOKEN && docker-compose down || true && docker-compose up -d"

      - name: Limpiar claves
        if: always()
        run: rm -f /tmp/deploy_key.pem /tmp/docker-compose-deploy.yml