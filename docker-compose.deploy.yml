services:
  db:
    image: mysql:8.0
    container_name: innovatech-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootPass2025!
      MYSQL_DATABASE: despachos_db
      MYSQL_USER: despacho_user
      MYSQL_PASSWORD: DespachoPass2025!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - innovatech-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPass2025!"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    image: DOCKER_USER_PLACEHOLDER/innovatech-backend:latest
    container_name: innovatech-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_ENDPOINT: db
      DB_PORT: 3306
      DB_NAME: despachos_db
      DB_USERNAME: despacho_user
      DB_PASSWORD: DespachoPass2025!
    depends_on:
      db:
        condition: service_healthy
    networks:
      - innovatech-network
volumes:
  mysql_data:
    driver: local
networks:
  innovatech-network:
    driver: bridge
